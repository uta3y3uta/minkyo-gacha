name: Update articles.json

on:
  schedule:
    # 毎日 06:30 JST（= 21:30 UTC）に更新
    - cron: "30 21 * * *"
  workflow_dispatch: {}   # 手動実行も可能
  push:
    branches: [main]
    paths:
      - "scripts/fetch-articles.mjs"
      - ".github/workflows/update-articles.yml"

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch articles
        run: node scripts/fetch-articles.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- articles.json; then
            echo "No changes."
            exit 0
          fi
          git add articles.json
          git commit -m "chore: update articles.json ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
